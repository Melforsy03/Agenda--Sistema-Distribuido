# Traefik Static Configuration
# For Agenda Distribuida TLS Security

api:
  dashboard: true
  insecure: true  # Dashboard en puerto 8080 (solo desarrollo)

log:
  level: DEBUG

entryPoints:
  # HTTPS para API y Frontend
  websecure:
    address: ":443"
  
  # WSS para WebSockets seguros
  wss:
    address: ":8443"

providers:
  # Docker provider para auto-discovery
  docker:
    exposedByDefault: false
    network: agenda_net
  
  # File provider para configuración dinámica
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
