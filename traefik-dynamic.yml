# Traefik Dynamic Configuration
# Routing rules for Agenda Distribuida

# TLS Configuration - MUST be in dynamic config for file provider
tls:
  certificates:
    - certFile: /certs/server.crt
      keyFile: /certs/server.key
  
  stores:
    default:
      defaultCertificate:
        certFile: /certs/server.crt
        keyFile: /certs/server.key

http:
  routers:
    # API Coordinator - Mayor prioridad
    coordinator-api:
      rule: "PathPrefix(`/auth`) || PathPrefix(`/events`) || PathPrefix(`/groups`) || PathPrefix(`/users`) || PathPrefix(`/leaders`) || PathPrefix(`/health`) || PathPrefix(`/coordinators`) || PathPrefix(`/admin`)"
      entryPoints:
        - websecure
      service: coordinator
      tls: {}
      priority: 100
    
    # Frontend Streamlit - Menor prioridad (catch-all)
    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      service: frontend
      tls: {}
      priority: 1

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend_a:8501"
    
    coordinator:
      loadBalancer:
        servers:
          - url: "http://coordinator:8700"

# WebSocket routing (TCP mode for proper WS handling)
tcp:
  routers:
    websocket-secure:
      rule: "HostSNI(`*`)"
      entryPoints:
        - wss
      service: websocket
      tls: {}

  services:
    websocket:
      loadBalancer:
        servers:
          - address: "coordinator:8767"
